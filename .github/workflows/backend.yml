name: Backend completo - coleta e governança

on:
  workflow_dispatch:
    inputs:
      acao:
        description: Operação do pipeline
        type: choice
        options: [validar, coletar]
        default: validar
  schedule:
    - cron: '0 6 * * *'

permissions:
  contents: read

concurrency:
  group: backend-coleta
  cancel-in-progress: false

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    services:
      postgres_teste:
        image: postgres:18
        env:
          POSTGRES_DB: hackathon2026_teste
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: teste_isolado
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
      CML_TOKEN: ${{ secrets.CML_TOKEN }}
      GOVERNANCA_REVISORES: ${{ vars.GOVERNANCA_REVISORES }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Preparar OCR português
        run: python preparar_ocr.py
      - name: Testar API, adaptadores, OCR e governança em banco isolado
        run: python -m pytest -q
        env:
          DATABASE_URL: ''
          DB_HOST: 127.0.0.1
          DB_PORT: '5432'
          DB_USER: postgres
          DB_PASSWORD: teste_isolado
          DB_NAME: hackathon2026_teste
          DB_TEST_NAME: hackathon2026_teste
      - name: Executar backend hospedado
        run: python deploy/worker.py --acao "${ACAO}"
        env:
          ACAO: ${{ github.event_name == 'schedule' && 'coletar' || inputs.acao }}
      - name: Preservar relatórios e documentos da coleta
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-${{ github.run_id }}
          retention-days: 7
          path: |
            dados_recebidos/pipeline/resultado.json
            dados_recebidos/pipeline/coleta.zip
            dados_recebidos/pipeline/docs/
            dados_recebidos/conferencia_fonte/resultado.json
            dados_recebidos/conferencia_fonte/dadosabertos.html
